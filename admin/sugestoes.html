<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Sugestões | Empório Brasileiro</title>

  <link
    rel="stylesheet"
    href="../frontend/css/estilo.css"
  >

  <link rel="stylesheet" href="admin.css">

  <script src="admin.js" defer></script>
</head>

<body class="admin-body" data-page="sugestoes">
  <div id="admin-app"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const menu = document.querySelector(".admin-nav");

      if (!menu) return;

      const link = document.createElement("a");

      link.href = "especialista.html";
      link.textContent = "Avaliar produto";

      menu.append(link);
    });
  </script>
</body>
</html>
